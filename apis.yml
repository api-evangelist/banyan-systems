aid: banyan-systems

name: Banyan Systems

description: Banyan is a privacy-first, item-level receipt data infrastructure platform that acts as middleware between merchants, banks, fintechs,
  and merchant service providers so they can securely share and enrich transaction data without bilateral contracts. Merchants send receipt and
  item detail to Banyan (via REST API or batch), and financial institutions submit card transactions to be matched and enriched with SKU-level
  line items, powering products like card-linked offers (CLO), expense management, and receipt display inside banking apps. Banyan has processed
  over 21 billion receipts across a network of 40,000+ merchant stores and 5,000+ financial institutions. Founded in 2013, backed by Battery Ventures,
  Fin Capital, M13, TTV Capital and others, and acquired by Bilt Rewards in March 2025. The public developer platform at developers.banyan.com
  exposes an OAuth2 REST API (api.banyan.com/rest/v1) plus a webhook egress surface for enriched transactions and offer redemptions.

