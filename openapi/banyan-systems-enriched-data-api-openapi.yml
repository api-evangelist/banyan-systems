components:
  schemas:
    TransactionEgressJSON:
      properties:
        authorization_ts:
          description: The time at which the transaction was authorized in RFC3339 format. UTC if possible.
          example: '2021-10-01T10:45:55Z'
          format: date-time
          type: string
        byn_transaction_id:
          description: The Banyan ID generated for the transaction
          example: 218823ba-3fec-483b-8803-8c04f7e10d7f
          format: uuid
          type: string
        custom_fields:
          additionalProperties:
            type: string
          description: Set of custom fields set on the transaction.
          type: object
        description:
          description: Description of the transaction.
          example: Purchase of pickles at Tommy's Pickles.
          type: string
        finx_consumer_token:
          description: The merchant's token for the consumer.
          example: 5ASD32K2L34FA
          type: string
        finx_transaction_id:
          description: The finx's internal ID for the transaction.
          example: 5LA3LQKLR34L23L2
          type: string
        location:
          $ref: '#/components/schemas/LocationEgressJSON'
        merchant:
          $ref: '#/components/schemas/MerchantEgressJSON'
        order_type:
          $ref: '#/components/schemas/OrderType'
        payment:
          $ref: '#/components/schemas/TransactionPaymentEgressJSON'
        purchase_ts:
          description: The time at which purchase occurred in RFC3339 format. UTC if possible.
          example: '2021-10-01T10:45:55Z'
          format: date-time
          type: string
        received_ts:
          description: The time at which the receipt was received in RFC3339. UTC if possible.
          example: '2021-10-01T10:45:55Z'
          format: date-time
          type: string
      required:
      - byn_transaction_id
      - received_ts
      - finx_transaction_id
      type: object
    OfferHotelCriteriaEgressJSON:
      properties:
        dining_excl_tags:
          description: The tags that will disqualify a dining charge from the offer. Has priority over included dining charge tags. Leaving this empty will mean none of a dining charge's tags are disqualified by default.
          items:
            description: A key-value pair that represents some form of tagged information.
            example: foo:|:bar
            minLength: 5
            pattern: ^.+:\|:.+$
            type: string
          type: array
        dining_incl_tags:
          description: The tags that will qualify a dining charge for the offer. Is trumped by excluded dining charge tags. Leaving this empty will mean all of a dining charge's tags qualify by default.
          items:
            description: A key-value pair that represents some form of tagged information.
            example: foo:|:bar
            minLength: 5
            pattern: ^.+:\|:.+$
            type: string
          type: array
        dining_spend_threshold:
          description: The minimum amount of cumulative spend due to qualified dining charges that is required for the offer to be fulfilled. Setting to 0 will mean any qualifying spend will fulfill the offer.
          example: '42.00'
          format: decimal
          minLength: 1
          pattern: ^-?\d+(\.\d+)?$
          type: string
        fulfillment_count_limit:
          description: The maximum number of times an offer can be marked as fulfilled for a single activation.
          type: integer
        room_disqualification_expression:
          description: The expression string to be applied to a room charge's tags when determining disqualification. Has priority over qualification expression. Leaving this empty will mean no tags are disqualified by default. Expression strings are boolean logical operations applied to the tags on a room charge. The syntax is composed of the boolean operators `and` and `or` applied to  tags wrapped in double quotes. Parentheses are also supported for grouping logical expressions.
          example: '"service:|:laundry" or ("category:|:snacks" and "description:|:candy")'
          type: string
        room_excl_tags:
          description: (DEPRECATED, please use room_disqualification_expression instead. Tags set on this field will automatically be converted into an expression string on room_disqualification_expression) The tags that will disqualify a room charge from the offer. Has priority over included room charge tags. Leaving this empty will mean none of a room charge's tags are disqualified by default.
          items:
            description: A key-value pair that represents some form of tagged information.
            example: foo:|:bar
            minLength: 5
            pattern: ^.+:\|:.+$
            type: string
          type: array
        room_incl_tags:
          description: (DEPRECATED, please use room_qualification_expression instead. Tags set on this field will automatically be converted into an expression string on room_qualification_expression) The tags that will qualify a room charge for the offer. Is trumped by excluded room charge tags. Leaving this empty will mean all of a room charge's tags qualify by default.
          items:
            description: A key-value pair that represents some form of tagged information.
            example: foo:|:bar
            minLength: 5
            pattern: ^.+:\|:.+$
            type: string
          type: array
        room_qualification_expression:
          description: The expression string to be applied to a room charge's tags when determining qualification. Is trumped by disqualification expression. Leaving this empty will mean all tags qualify by default. Expression strings are boolean logical operations applied to the tags on a room charge. The syntax is composed of the boolean operators `and` and `or` applied to  tags wrapped in double quotes. Parentheses are also supported for grouping logical expressions.
          example: '"service:|:laundry" or ("category:|:snacks" and "description:|:candy")'
          type: string
        room_spend_threshold:
          description: The minimum amount of cumulative spend due to qualified room charges that is required for the offer to be fulfilled. Setting to 0 will mean any qualifying spend will fulfill the offer.
          example: '42.00'
          format: decimal
          minLength: 1
          pattern: ^-?\d+(\.\d+)?$
          type: string
      type: object
    MerchantEgressJSON:
      properties:
        name:
          description: The business name.
          example: PicklesRUS
          type: string
      type: object
    OfferRedemptionResultEgressJSON:
      properties:
        amount_back:
          description: The calculated amount of rewards to be awarded.
          example: '5.04'
          format: decimal
          minLength: 1
          pattern: ^-?\d+(\.\d+)?$
          type: string
        cumulative_qualified_total_amount:
          description: The total cumulative spend due to qualified elements of the receipt.
          example: '42.00'
          format: decimal
          minLength: 1
          pattern: ^-?\d+(\.\d+)?$
          type: string
        fulfilled:
          description: Marks if the offer was determined fulfilled according to the eligible offer's criteria. When the fulfillment count limit has already been exceeded for the activation, this will be marked false.
          type: boolean
        hotel:
          $ref: '#/components/schemas/OfferRedemptionHotelResultEgressJSON'
        items:
          $ref: '#/components/schemas/OfferRedemptionItemsResultEgressJSON'
      type: object
    CurrencyAmount:
      format: decimal
      minItems: 1
      type: string
    EnrichedTransactionEgressJSON:
      allOf:
      - $ref: '#/components/schemas/BaseEnrichedTransactionEgressJSON'
      properties:
        receipt:
          $ref: '#/components/schemas/ReceiptEgressJSON'
      title: Enriched Transaction
      type: object
    CampaignEgressJSON:
      properties:
        budget:
          description: The maximum amount that can be spent on this campaign's rewards.
          type: integer
        byn_campaign_id:
          description: The generated Banyan ID for the offer redemption.
          example: b276d649-0f54-4dbb-bcd1-197f1cbb59be
          format: uuid
          type: string
        byn_publisher_id:
          description: The Banyan ID for the publisher (transaction provider) owning the campaign.
          type: integer
        created_ts:
          description: The timestamp the campaign was created.
          example: '2021-10-01T10:45:55Z'
          format: date-time
          type: string
        name:
          description: The name of the campaign given by the publisher.
          example: Awesome Campaign
          type: string
        updated_ts:
          description: The timestamp the campaign was last updated.
          example: '2021-10-01T10:45:55Z'
          format: date-time
          type: string
      required:
      - byn_campaign_id
      type: object
    FulfillmentType:
      enum:
      - ship
      - delivery
      - pickup
      type: string
    BaseOfferRedemptionEgressJSON:
      properties:
        campaign:
          $ref: '#/components/schemas/CampaignEgressJSON'
        created_ts:
          description: The timestamp the offer redemption was generated.
          example: '2021-10-01T10:45:55Z'
          format: date-time
          type: string
        fulfillment_count:
          description: The number of times this offer activation has had a unique transaction that fulfilled the offer.
          type: integer
        id:
          description: The generated Banyan ID for the offer redemption.
          example: 5dd9f994-3d7b-4fc9-a0a2-f4bb08ca6f1b
          type: string
        offer:
          $ref: '#/components/schemas/OfferEgressJSON'
        offer_activation:
          $ref: '#/components/schemas/OfferActivationEgressJSON'
        result:
          $ref: '#/components/schemas/OfferRedemptionResultEgressJSON'
      required:
      - id
      type: object
    OrderType:
      enum:
      - in_store
      - web
      type: string
    EncryptedSensitiveDataEgressJSON:
      properties:
        data:
          format: binary
          type: string
        dek:
          format: binary
          type: string
        encryption_ts:
          format: date-time
          type: string
        kek_id:
          type: string
        schema:
          type: string
        schema_url:
          format: uri
          type: string
      required:
      - kek_id
      - dek
      - data
      - encryption_ts
      type: object
    ReceiptEgressJSON:
      oneOf:
      - $ref: '#/components/schemas/ReceiptHotelEgressJSON'
      - $ref: '#/components/schemas/ReceiptMerchantEgressJSON'
      type: object
    OfferRedemptionEgressJSON:
      allOf:
      - $ref: '#/components/schemas/BaseOfferRedemptionEgressJSON'
      properties:
        enriched_transaction:
          $ref: '#/components/schemas/EnrichedTransactionEgressJSON'
      title: Offer Redemption
      type: object
    OfferRedemptionItemsResultEgressJSON:
      properties:
        qualified_ids:
          description: A list of the item ID's that qualified for the offer.
          items:
            type: string
          type: array
        qualified_total_amount:
          description: The total cumulative spend due to qualified items.
          example: '42.00'
          format: decimal
          minLength: 1
          pattern: ^-?\d+(\.\d+)?$
          type: string
        unqualified_ids:
          description: A list of the item ID's that did not qualify for the offer.
          items:
            type: string
          type: array
      type: object
    HotelTaxesEgressJSON:
      properties:
        city_occupancy:
          $ref: '#/components/schemas/CurrencyAmount'
        occupancy:
          $ref: '#/components/schemas/CurrencyAmount'
        other_taxes:
          additionalProperties:
            $ref: '#/components/schemas/CurrencyAmount'
          description: Map of names to tax amounts.
          type: object
        state_occupancy:
          $ref: '#/components/schemas/CurrencyAmount'
        tourism:
          $ref: '#/components/schemas/CurrencyAmount'
      type: object
    HotelDailyChargesEgressJSON:
      properties:
        credits:
          $ref: '#/components/schemas/CurrencyAmount'
        dining:
          $ref: '#/components/schemas/HotelDiningEgressJSON'
        fees:
          $ref: '#/components/schemas/HotelFeesEgressJSON'
        per_night_date:
          description: The date of the night the charge is for in RFC3339 format. UTC if possible.
          example: '2021-10-01T10:45:55Z'
          format: date-time
          type: string
        room:
          $ref: '#/components/schemas/HotelRoomEgressJSON'
        spa:
          description: The spa charges during the day.
          items:
            $ref: '#/components/schemas/SpaChargeEgressJSON'
          type: array
        tax:
          $ref: '#/components/schemas/HotelTaxesEgressJSON'
      required:
      - per_night_date
      type: object
    ValidationJSON:
      properties:
        field:
          description: The field that failed validation.
          type: string
        message:
          description: A human readable message describing the validation error.
          type: string
        value:
          $ref: '#/components/schemas/FieldTypesJSON'
      required:
      - field
      - message
      type: object
    AddressEgressJSON:
      properties:
        address_line_one:
          description: For brick and mortar transactions only.
          example: 100 Main Street
          type: string
        address_line_two:
          description: For brick and mortar transactions only.
          example: Suite 100
          type: string
        city:
          description: For brick and mortar transactions only.
          example: Holmdel
          type: string
        country:
          description: For brick and mortar transactions only.
          example: USA
          type: string
        postal_code:
          description: For brick and mortar transactions only.
          example: '07733'
          type: string
        state:
          description: For brick and mortar transactions only.
          example: NJ
          type: string
      type: object
    HotelFeesEgressJSON:
      properties:
        business_center:
          $ref: '#/components/schemas/CurrencyAmount'
        cancellation:
          $ref: '#/components/schemas/CurrencyAmount'
        incidental_cost:
          $ref: '#/components/schemas/CurrencyAmount'
        laundry:
          $ref: '#/components/schemas/CurrencyAmount'
        no_show:
          $ref: '#/components/schemas/CurrencyAmount'
        other_fees:
          additionalProperties:
            $ref: '#/components/schemas/CurrencyAmount'
          description: Map of names to fee amounts.
          type: object
        parking:
          $ref: '#/components/schemas/CurrencyAmount'
        resort:
