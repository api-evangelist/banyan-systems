info:
  description: REST API for communicating with Banyan's systems
  title: Banyan REST API
  version: 1.0.3
openapi: 3.0.0
security:
- bearerToken: []
servers:
- url: https://api.banyan.com
paths:
  /oauth/token:
    post:
      description: Get a bearer token to use with subsequent calls.
      operationId: oauth-token
      parameters:
      - description: The grant type to use.  Must be 'client_credentials'.
        in: header
        name: Grant_Type
        required: true
        schema:
          default: client_credentials
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  access_token:
                    description: The bearer token to use for subsequent requests.
                    type: string
                  expires_in:
                    description: The number of seconds until the token expires.
                    type: integer
                type: object
          description: Success
        '401':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                type: object
          description: Unauthorized
        '500':
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                type: object
          description: Internal Server Error
      security:
      - basic: []
      summary: Get a Bearer Token
      tags:
      - Authentication
  /v1/campaign:
    get:
      description: Return all campaigns for a partner
      operationId: retrieve-all-campaigns
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/CampaignEgressJSON'
                    minItems: 1
                    type: array
                  errors:
                    items:
                      $ref: '#/components/schemas/ErrorJSON'
                    type: array
                  request_id:
                    format: uuid
                    type: string
                required:
                - data
                - errors
                type: object
          description: The campaigns.
        '401':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items: {}
                    maxItems: 0
                    type: array
                  errors:
                    items:
                      $ref: '#/components/schemas/ErrorJSON'
                    minItems: 1
                    type: array
                  request_id:
                    format: uuid
                    type: string
                required:
                - data
                - errors
                type: object
          description: Bearer token expired or not correct.
        '403':
