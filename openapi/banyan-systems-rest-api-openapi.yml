  /v1/history:
    post:
      description: Get the history of data associated with a finx consumer token.  The default time range is from the beginning of time to now and the start and/or end of the range can be overridden.  This request is a POST because the time of request is a component in generating the response and the HTTP spec disallows caching POSTs so any caching proxies or clever HTTP request libraries should behave correctly.  The response is limited to 1000 items.  If more are expected request again with the start date advanced to after the last item returned.
      operationId: retrieve-history
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoryParametersJSON'
        description: The consumer token and optional data range for history.
        required: true
      responses:
